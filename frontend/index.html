<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宝石花园 · GEM GARDEN</title><link rel="stylesheet" href="style.css"></head>
<body class="selection-screen">
<header><a class="brand" href="./"><span class="brand-icon">✧</span><span>宝石花园<small>GEM GARDEN</small></span></a><span class="tagline">把片刻闲暇，拼成闪耀。</span><button id="sound" aria-label="切换音效" aria-pressed="false">♫ 音效关</button></header>
<main><aside id="selection"><div class="eyebrow">GEM GARDEN</div><h1>选择你想完成的贴画</h1><p class="intro">从一颗宝石开始，慢慢拼出属于你的光芒。</p><div id="gallery" aria-busy="true"><p>正在准备贴画…</p></div></aside>
<section class="studio" hidden><div class="studio-head"><button id="back" aria-label="返回选择贴画">‹ 返回选图</button><div><div class="eyebrow">THE CANVAS</div><h2 id="title">翡翠花冠</h2></div><div class="progress-label"><strong id="percent">0%</strong><span id="count">0 / 45 颗</span></div></div><div class="progress-track"><div id="progress"></div></div><div class="palette-wrap"><span id="gem-name" class="palette-label">选择宝石</span><div id="palette" role="group" aria-label="宝石颜色"></div></div><div class="canvas-wrap" id="viewport"><div class="canvas-caption">✦ 点亮属于你的花园 ✦</div><canvas id="canvas" role="img" aria-label="宝石贴画画布"></canvas><div id="complete" hidden><span>✧</span><h3>你的花园，闪耀了。</h3><p>每一颗光芒，都来自你的耐心。</p><button id="continue">欣赏画作</button></div><div class="canvas-bottom"><span id="hint">选择宝石，点击对应编号</span><button id="fit" title="恢复画布">适应画布</button></div></div><div class="toolbar"><div class="modes" role="group" aria-label="操作模式"><button data-mode="tap" class="active">☝ 点击</button><button data-mode="paint">✧ 连贴</button><button data-mode="pan">✥ 移动</button></div><div class="tools"><button id="undo" title="撤销上一次贴放">↶</button><button id="minus" aria-label="缩小">−</button><span id="zoom">100%</span><button id="plus" aria-label="放大">＋</button><button id="reset">重来</button></div></div></section></main><footer>GEM GARDEN <span>一场没有倒计时的小小创作</span><span>✦</span></footer><div id="toast" role="status"></div><script src="app.js"></script></body></html>
