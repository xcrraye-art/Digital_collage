<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宝石花园 · GEM GARDEN</title><style>
:root{--ink:#343039;--muted:#969097;--accent:#b94c76;--line:#efedef}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#fff;color:var(--ink);font-family:'PingFang SC','Microsoft YaHei',sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 14px;transition:background .15s}button:hover{background:#faf7f8}button:focus-visible,a:focus-visible{outline:3px solid #c97495;outline-offset:3px}button:disabled{opacity:.35;cursor:default}header{height:84px;margin:auto;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);font-size:20px;letter-spacing:3px}.brand-icon{font-size:38px;color:#bc8c9d}.brand small{display:block;font-size:9px;letter-spacing:4px;margin-top:6px}.tagline{font-size:12px;letter-spacing:3px;color:var(--muted)}#sound{font-size:12px;background:#fff}.selection-screen #sound{display:none}main{margin:0 auto;max-width:1440px}.eyebrow{font-size:10px;letter-spacing:3px;color:#aaa}#selection{text-align:center;padding:58px 40px 70px}h1{font-size:30px;letter-spacing:3px;font-weight:400;margin:20px 0 16px}.intro{font-size:13px;line-height:2;color:var(--muted);margin:0 0 36px}#gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;max-width:1000px;margin:auto}.art-card{display:flex;flex-direction:column;text-align:left;position:relative;padding:20px 20px 23px;border:1px solid #eee;border-radius:14px;background:#fff;box-shadow:0 5px 24px #30203005}.art-card:hover{background:#fff;border-color:#d9b9c7;box-shadow:0 8px 30px #3020300a}.art-card svg{width:100%;height:auto;aspect-ratio:1;background:#fff}.art-card>span:not(.arrow){display:block;padding:16px 3px 0;width:100%;border-top:1px solid var(--line)}.art-card strong{font-size:16px;font-weight:400;letter-spacing:2px}.art-card small{font-size:10px;letter-spacing:1px;color:var(--muted);display:block;margin-top:9px}.art-card .arrow{position:absolute;right:22px;bottom:28px;font-size:20px;color:#c1839c}.studio{background:#fff;overflow:hidden}.studio-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 5vw 18px;border-bottom:1px solid var(--line)}.studio-head>div:nth-child(2){text-align:center;position:absolute;left:50%;transform:translateX(-50%)}.studio-head .eyebrow{display:none}h2{font-size:20px;font-weight:400;letter-spacing:3px;margin:0}.progress-label{text-align:right;margin-left:auto}.progress-label strong{display:block;font:20px Georgia;color:#916b80}.progress-label span{display:block;font-size:10px;color:var(--muted);margin-top:4px}#back{border:0;color:var(--accent);background:white;padding-left:0}.progress-track{height:2px;background:#f5f5f5}#progress{height:100%;background:#d4a8bb;transition:width .3s}.palette-wrap{display:flex;align-items:center;justify-content:center;gap:26px;padding:12px;border-bottom:1px solid var(--line);box-shadow:0 3px 8px #00000003}.palette-label{display:none}#palette{display:flex;gap:20px}.gem-choice{border:1px solid transparent;border-radius:9px;background:white;padding:4px 10px;min-width:56px}.gem-choice.active{background:#fff;border-color:#e9c5d4}.gem-choice svg{display:block;width:42px;height:46px;margin:auto}.gem-choice span{font-size:12px;display:block;margin-top:4px;color:#a15b78}.canvas-wrap{height:calc(100dvh - 320px);min-height:420px;position:relative;overflow:hidden;background:#fff;touch-action:none}.canvas-caption{display:none}#canvas{position:absolute;width:100%;height:100%;touch-action:none;transform-origin:center;user-select:none}.slot{cursor:pointer}.slot text{pointer-events:none;font-size:16px;font-family:Georgia}.slot.placed{cursor:default}.slot.selected:not(.placed) .outline{stroke:#c5bec2;stroke-width:1.8}.slot:not(.placed):hover .outline{stroke:#b68b9d;stroke-width:3}.slot.placed .jewel{animation:pop .28s ease-out}.spark{pointer-events:none;animation:spark .7s forwards;fill:#d396b0}.canvas-bottom{position:absolute;bottom:16px;left:5vw;right:5vw;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#aaa;pointer-events:none}.canvas-bottom button{pointer-events:auto;font-size:10px;padding:6px 9px;background:#ffffffde}.toolbar{display:flex;justify-content:center;padding:14px 22px;gap:30px;border-top:1px solid var(--line)}.modes{display:flex;gap:3px;background:#f7f7f7;border-radius:9px;padding:3px}.modes button{border:0;background:none;font-size:12px;padding:9px 14px}.modes button.active{background:#fff;box-shadow:0 2px 6px #00000008;color:var(--accent)}.tools{display:flex;gap:8px;align-items:center}.tools button{padding:7px 10px;font-size:13px;border:0}.tools span{font-size:10px;width:40px;text-align:center;color:var(--muted)}#reset{font-size:11px;border-left:1px solid var(--line);border-radius:0;margin-left:6px}footer{max-width:1240px;margin:0 auto;padding:24px 40px;display:flex;justify-content:space-between;color:#aaa;font-size:9px;letter-spacing:2px}.game-screen footer,.game-screen .tagline{display:none}.game-screen header{height:64px}.game-screen .brand{font-size:16px}.game-screen .brand-icon{font-size:30px}.game-screen .brand small{display:none}#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:12px;background:#554650;color:white;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:10}#toast.show{opacity:1}#complete{position:absolute;inset:0;background:#fffffff0;backdrop-filter:blur(5px);text-align:center;padding-top:15%;z-index:3}#complete>span{font-size:65px;color:#c78da5}#complete h3{font-size:24px;font-weight:400;letter-spacing:3px}#complete p{font-size:12px;color:var(--muted)}#continue{margin-top:12px;background:#b46c89;color:white}@keyframes pop{0%{opacity:.3;transform:scale(.5)}70%{transform:scale(1.1)}100%{transform:scale(1)}}@keyframes spark{0%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}@media(max-width:640px){header{padding:0 18px;height:70px}.brand{font-size:17px}.brand-icon{font-size:32px}.tagline{display:none}#selection{padding:32px 16px 40px}h1{font-size:23px;letter-spacing:1px}.intro{font-size:11px;margin-bottom:24px}#gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.art-card{padding:10px 10px 16px;border-radius:10px}.art-card strong{font-size:13px;letter-spacing:1px}.art-card small{font-size:8px;letter-spacing:0}.art-card .arrow{right:12px;bottom:36px;font-size:15px}.studio-head{padding:16px 14px;gap:8px}h2{font-size:16px;letter-spacing:1px}#back{font-size:11px}.progress-label strong{font-size:17px}.progress-label span{font-size:9px}#palette{gap:8px}.gem-choice{min-width:48px;padding:4px 7px}.gem-choice svg{width:34px;height:40px}.palette-wrap{padding:10px}.canvas-wrap{height:calc(100dvh - 295px);min-height:340px}.toolbar{padding:10px 6px;justify-content:center;gap:8px;flex-wrap:wrap}.modes button{padding:8px 10px}.tools{gap:2px}.canvas-bottom{left:12px;right:12px;font-size:9px}footer{padding:20px 18px;font-size:8px;letter-spacing:1px}footer>span:last-child{display:none}#complete h3{font-size:20px}}

</style></head>
<body class="selection-screen">
<header><a class="brand" href="#"><span class="brand-icon">✧</span><span>宝石花园<small>GEM GARDEN</small></span></a><span class="tagline">把片刻闲暇，拼成闪耀。</span><button id="sound" aria-label="切换音效" aria-pressed="false">♫ 音效关</button></header>
<main><aside id="selection"><div class="eyebrow">GEM GARDEN</div><h1>选择你想完成的贴画</h1><p class="intro">从一颗宝石开始，慢慢拼出属于你的光芒。</p><div id="gallery"></div></aside>
<section class="studio" hidden><div class="studio-head"><button id="back" aria-label="返回选择贴画">‹ 返回选图</button><div><div class="eyebrow">THE CANVAS</div><h2 id="title">翡翠花冠</h2></div><div class="progress-label"><strong id="percent">0%</strong><span id="count">0 / 45 颗</span></div></div><div class="progress-track"><div id="progress"></div></div><div class="palette-wrap"><span class="palette-label">选择宝石</span><div id="palette" role="group" aria-label="宝石颜色"></div></div><div class="canvas-wrap" id="viewport"><div class="canvas-caption">✦ 点亮属于你的花园 ✦</div><svg id="canvas" viewBox="0 0 800 800" aria-label="宝石贴画画布"></svg><div id="complete" hidden><span>✧</span><h3>你的花园，闪耀了。</h3><p>每一颗光芒，都来自你的耐心。</p><button id="continue">欣赏画作</button></div><div class="canvas-bottom"><span id="hint">选择宝石，点击对应编号</span><button id="fit" title="恢复画布">适应画布</button></div></div><div class="toolbar"><div class="modes" role="group" aria-label="操作模式"><button data-mode="tap" class="active">☝ 点击</button><button data-mode="paint">✧ 连贴</button><button data-mode="pan">✥ 移动</button></div><div class="tools"><button id="undo" title="撤销上一次贴放">↶</button><button id="minus" aria-label="缩小">−</button><span id="zoom">100%</span><button id="plus" aria-label="放大">＋</button><button id="reset">重来</button></div></div></section></main><footer>GEM GARDEN <span>一场没有倒计时的小小创作</span><span>✦</span></footer><div id="toast" role="status"></div><script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const colors=[{name:'翠绿透辉石',color:'#137448',dark:'#063321',light:'#8dd399',shape:'drop'},{name:'玫红宝石',color:'#b33179',dark:'#4b103f',light:'#f3a1c4',shape:'round'},{name:'琥珀红晶',color:'#c05937',dark:'#62221d',light:'#ffd1a2',shape:'leaf'},{name:'金色榍石',color:'#d3ae43',dark:'#746122',light:'#fff5b0',shape:'round'},{name:'月光石',color:'#6293b1',dark:'#244d75',light:'#d9f4fa',shape:'round'}];
const templates=[{name:'翡翠花冠',sub:'EMERALD BLOOM · 45 颗',make:flower},{name:'春日枝语',sub:'SPRING LEAVES · 67 颗',make:branch},{name:'繁星花海',sub:'STARRY GARDEN · 217 颗',make:field}];
function ring(n,r,c,w,h,shape,offset=0){return Array.from({length:n},(_,i)=>{let a=i*Math.PI*2/n+offset;return{x:400+Math.sin(a)*r,y:400-Math.cos(a)*r,angle:a*180/Math.PI,c,w,h,shape}})}
function flower(){return[...ring(16,228,0,71,108,'drop'),...ring(16,155,1,48,48,'round',Math.PI/16),...ring(12,89,2,34,81,'leaf'),{x:400,y:400,angle:0,c:3,w:60,h:60,shape:'round'}]}
function branch(){let out=[];for(let i=0;i<11;i++){let y=190+i*39,x=380+Math.sin(i*.45)*55;out.push({x,y,c:3,w:16,h:16,shape:'round',angle:0});for(let side of [-1,1]){out.push({x:x+side*58,y:y-23,c:i%3===0?4:0,w:34,h:76,shape:'leaf',angle:side*48});out.push({x:x+side*104,y:y-53,c:1,w:23,h:23,shape:'round',angle:0});out.push({x:x+side*119,y:y-31,c:3,w:13,h:13,shape:'round',angle:0})}}return out.slice(0,67)}
function field(){let out=[{x:400,y:400,c:3,w:24,h:24,shape:'round',angle:0}];for(let k=1;k<=8;k++)out.push(...ring(k*6,k*33,k%5,17,20,k%3===0?'drop':'round',k*.13));return out}
function path(shape){return shape==='drop'?'M0 -50 C-13 -34 -34 -4 -32 17 C-30 56 30 56 32 17 C34 -4 13 -34 0 -50Z':shape==='leaf'?'M0 -50 Q-43 0 0 50 Q43 0 0 -50Z':'M0 -48 C65 -48 65 48 0 48 C-65 48 -65 -48 0 -48Z'}
function defs(prefix){return `<defs>${colors.map((c,i)=>`<radialGradient id="${prefix}g${i}" cx="32%" cy="27%" r="80%"><stop stop-color="${c.light}"/><stop offset=".32" stop-color="${c.color}"/><stop offset="1" stop-color="${c.dark}"/></radialGradient>`).join('')}<filter id="${prefix}shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity=".23"/></filter><filter id="${prefix}inset"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#7b8074" flood-opacity=".25"/></filter></defs>`}
function jewel(s,prefix){let d=path(s.shape);return `<g class="jewel" filter="url(#${prefix}shadow)"><path d="${d}" fill="url(#${prefix}g${s.c})"/><clipPath id="${prefix}clip"><path d="${d}"/></clipPath><g clip-path="url(#${prefix}clip)"><path d="M-50 -40 L-14 -20 4 -45 21 -12 50 -30 35 23 11 42 -13 18 -48 36Z" fill="${colors[s.c].dark}" opacity=".44"/><path d="M-50 -40 L-14 -20 -32 8Z M4 -45 L21 -12 -14 -20Z M35 23 L11 42 7 4Z" fill="white" opacity=".58"/><path d="M-14 -20 L21 -12 7 4 -13 18 -32 8Z" fill="${colors[s.c].color}" opacity=".7"/><path d="M-32 8 L-13 18 -23 42Z M21 -12 L35 23 7 4Z" fill="${colors[s.c].light}" opacity=".35"/><path d="M-14 -20 L7 4 -13 18" fill="none" stroke="white" stroke-opacity=".15" stroke-width="1"/></g><path d="${d}" fill="none" stroke="white" stroke-opacity=".3" stroke-width="1.2"/></g>`}
let current=0,selected=0,mode='tap',scale=1,pan={x:0,y:0},items=[],filled=new Set(),history=[],sound=false,storage=true,toastTimer,audioCtx;
const $=id=>document.getElementById(id),canvas=$('canvas');
function save(){try{localStorage.setItem('gem-garden-'+current,JSON.stringify([...filled]))}catch{storage=false;notify('浏览器无法保存进度，本次仍可继续游玩')}}
function load(i){document.body.className='game-screen';$('selection').hidden=true;document.querySelector('.studio').hidden=false;mode='tap';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode==='tap'));$('hint').textContent='选择宝石，点击对应编号';current=i;items=templates[i].make();history=[];try{filled=new Set(JSON.parse(localStorage.getItem('gem-garden-'+i)||'[]').filter(n=>Number.isInteger(n)&&n>=0&&n<items.length))}catch{filled=new Set()}selected=0;scale=1;pan={x:0,y:0};$('complete').hidden=true;$('title').textContent=templates[i].name;render();transform();document.querySelectorAll('.art-card').forEach((b,n)=>b.classList.toggle('active',n===i))}
function render(){canvas.innerHTML=defs('main')+items.map((s,i)=>`<g class="slot ${filled.has(i)?'placed':''} ${selected===s.c?'selected':''}" data-id="${i}" transform="translate(${s.x} ${s.y}) rotate(${s.angle})"><g transform="scale(${s.w/100} ${s.h/100})">${filled.has(i)?jewel(s,'j'+i):`<path class="outline" d="${path(s.shape)}" fill="#fafafa" stroke="#e0e0e0" filter="url(#maininset)"/>`}</g>${!filled.has(i)?`<text transform="rotate(${-s.angle})" text-anchor="middle" dominant-baseline="central" fill="${selected===s.c?colors[s.c].dark:'#aaa'}" font-size="${s.w<25?10:16}">${s.c+1}</text>`:''}</g>`).join('');
// Give each jewel its own gradient definitions; IDs remain unique within the SVG.
canvas.insertAdjacentHTML('afterbegin',items.map((s,i)=>defs('j'+i)).join(''));update()}
function update(){let total=items.length,pct=Math.round(filled.size/total*100);$('percent').textContent=pct+'%';$('count').textContent=`${filled.size} / ${total} 颗`;$('progress').style.width=pct+'%';$('undo').disabled=!history.length;$('palette').innerHTML=colors.filter((_,c)=>items.some(s=>s.c===c)).map(c=>{let n=colors.indexOf(c),done=items.filter(s=>s.c===n).every(s=>filled.has(items.indexOf(s)));return `<button class="gem-choice ${selected===n?'active':''}" data-color="${n}" aria-label="${n+1}号 ${c.name}" aria-pressed="${selected===n}"><svg viewBox="-60 -60 120 120">${defs('p'+n)}${jewel({c:n,shape:c.shape},'p'+n)}</svg><span>${done?'✓':n+1}</span></button>`}).join('')}
function notify(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function chime(){if(!sound)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(650+selected*120,audioCtx.currentTime);g.gain.setValueAtTime(.045,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.17);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.18)}catch{}}
function place(id){let s=items[id];if(!s||filled.has(id))return;if(s.c!==selected){if(mode==='tap')notify(`这里需要 ${s.c+1} 号${colors[s.c].name}`);return}filled.add(id);history.push(id);save();let el=canvas.querySelector(`[data-id="${id}"]`);el.classList.add('placed');el.innerHTML=`<g transform="scale(${s.w/100} ${s.h/100})">${jewel(s,'j'+id)}</g>`;let star=document.createElementNS(NS,'text');star.setAttribute('x',s.x);star.setAttribute('y',s.y-20);star.setAttribute('class','spark');star.textContent='✦';canvas.append(star);setTimeout(()=>star.remove(),700);chime();update();if(filled.size===items.length){$('complete').hidden=false}else if(items.filter(x=>x.c===selected).every(x=>filled.has(items.indexOf(x)))){let next=items.findIndex((x,i)=>!filled.has(i));selected=items[next].c;render();notify('这一种宝石贴完了，继续下一种吧')}}
function transform(){canvas.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${scale})`;$('zoom').textContent=Math.round(scale*100)+'%'}
function zoom(delta){scale=Math.max(.7,Math.min(3,scale+delta));transform()}
$('gallery').innerHTML=templates.map((t,i)=>`<button class="art-card" data-art="${i}"><svg viewBox="0 0 800 800">${defs('thumb'+i)}${t.make().map((s,n)=>`<g transform="translate(${s.x} ${s.y}) rotate(${s.angle}) scale(${s.w/100} ${s.h/100})">${jewel(s,'thumb'+i)}</g>`).join('')}</svg><span><strong>${t.name}</strong><small>${t.sub}</small></span><span class="arrow">↗</span></button>`).join('');
$('gallery').onclick=e=>{let b=e.target.closest('[data-art]');if(b)load(Number(b.dataset.art))};$('palette').onclick=e=>{let b=e.target.closest('[data-color]');if(b){selected=Number(b.dataset.color);render()}};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));$('hint').textContent=mode==='pan'?'拖动画布移动 · 滚轮或按钮缩放':mode==='paint'?'按住并划过相同编号，连续贴放':'选择宝石，点击对应编号'});
let activePointer=null,last=null;
function hit(e){let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-id]');if(el)place(Number(el.dataset.id))}
$('viewport').addEventListener('pointerdown',e=>{if(e.target.closest('button')||!$('complete').hidden)return;activePointer=e.pointerId;last={x:e.clientX,y:e.clientY};$('viewport').setPointerCapture(e.pointerId);if(mode!=='pan')hit(e)});
$('viewport').addEventListener('pointermove',e=>{if(activePointer!==e.pointerId)return;if(mode==='pan'){pan.x+=e.clientX-last.x;pan.y+=e.clientY-last.y;transform()}else if(mode==='paint'){let dx=e.clientX-last.x,dy=e.clientY-last.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/4));for(let i=1;i<=n;i++)hit({clientX:last.x+dx*i/n,clientY:last.y+dy*i/n})}last={x:e.clientX,y:e.clientY}});
for(let name of ['pointerup','pointercancel','lostpointercapture'])$('viewport').addEventListener(name,()=>{activePointer=null;last=null});
$('viewport').addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?-.1:.1)},{passive:false});$('plus').onclick=()=>zoom(.2);$('minus').onclick=()=>zoom(-.2);$('fit').onclick=()=>{scale=1;pan={x:0,y:0};transform()};$('undo').onclick=()=>{if(history.length){filled.delete(history.pop());save();$('complete').hidden=true;render()}};$('reset').onclick=()=>{if(confirm('要清空这幅画的进度，重新开始吗？')){filled.clear();history=[];save();render();$('complete').hidden=true}};$('continue').onclick=()=>{$('complete').hidden=true};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♫ 音效开':'♫ 音效关';$('sound').setAttribute('aria-pressed',sound);if(sound)chime()};$('back').onclick=()=>{activePointer=null;last=null;document.body.className='selection-screen';$('selection').hidden=false;document.querySelector('.studio').hidden=true;$('gallery').querySelector(`[data-art="${current}"]`).focus()};

</script></body></html>
